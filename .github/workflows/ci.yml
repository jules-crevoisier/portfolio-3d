name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Vérifier les fichiers SEO et l'absence de CDN
        run: |
          test -f dist/robots.txt && test -f dist/sitemap.xml && test -f dist/og.jpg
          grep -q 'rel="canonical"' dist/index.html
          ! grep -rqE 'cdn\.jsdelivr|fonts\.googleapis|fonts\.gstatic' dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portfolio-3d:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name site -p 8080:8080 portfolio-3d:ci
          sleep 2
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q 'Jules Crevoisier'
          docker images portfolio-3d:ci --format 'Taille de l image : {{.Size}}'
